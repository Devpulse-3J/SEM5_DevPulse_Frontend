name: Deploy Next.js App

# Re-testing event delivery after a full uninstall/reinstall of the
# DevPulseIntegration GitHub App on Devpulse-3J.

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Makes GitHub create a real Deployment + deployment_status automatically
    # (its own built-in Environments feature) — DevPulse's GitHub App already
    # has the `deployments` permission this needs, and this is the exact
    # mechanism already populating real deployment data for the backend repo's
    # cd.yml (see its `deploy` job). Without this, DevPulse's DORA metrics have
    # no way to know a deploy happened.
    environment: production

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd SEM5_DevPulse_Frontend

            git pull origin main

            npm install

            npm run build

            pm2 restart odineye